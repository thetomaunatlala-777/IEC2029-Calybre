#got sections of this code from stack overflow 
# has a python and postgreSQL containers

services:
  db:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /data/postgres
      POSTGRES_DB: bank
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: always #what is the difference between this and unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres" ]
      interval: 30s
      timeout: 10s
      retries: 5

  python:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5333:5432" #had to change this from 5332 because it gave me an error that the port was already being used by postgreSQL
networks:
  db:
    driver: bridge

volumes:
  db:

